# TrailPay local Lightning regtest network.
# Two LND nodes (payee = TrailPay, payer = sender wallet) + bitcoind, so hodl
# invoices are genuinely *paid and held*, then settled by preimage reveal or
# cancelled to refund. Brought up via: npm run ln:up
#
# Uses Polar's container images for instant, seedless (--noseedbackup) wallets.

services:
  bitcoind:
    image: polarlightning/bitcoind:27.0
    container_name: trailpay-bitcoind
    restart: on-failure
    command:
      - bitcoind
      - -regtest=1
      - -server=1
      - -txindex=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=trailpay
      - -rpcpassword=trailpay
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
      - -fallbackfee=0.0002
      - -rpcworkqueue=512
    ports:
      - "18443:18443"
    networks: [lnnet]

  lnd_payee:
    image: polarlightning/lnd:0.18.5-beta
    container_name: trailpay-lnd-payee
    restart: on-failure
    depends_on: [bitcoind]
    command:
      - lnd
      - --noseedbackup
      - --trickledelay=5000
      - --alias=trailpay
      - --listen=0.0.0.0:9735
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=trailpay
      - --bitcoind.rpcpass=trailpay
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
      - --maxpendingchannels=10
    ports:
      - "10009:10009"
      - "8080:8080"
    networks: [lnnet]

  lnd_payer:
    image: polarlightning/lnd:0.18.5-beta
    container_name: trailpay-lnd-payer
    restart: on-failure
    depends_on: [bitcoind]
    command:
      - lnd
      - --noseedbackup
      - --trickledelay=5000
      - --alias=sender
      - --listen=0.0.0.0:9735
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=trailpay
      - --bitcoind.rpcpass=trailpay
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
      - --maxpendingchannels=10
    ports:
      - "10010:10009"
      - "8081:8080"
    networks: [lnnet]

networks:
  lnnet:
    name: trailpay-lnnet
